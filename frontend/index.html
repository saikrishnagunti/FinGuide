    <script>
      (function() {
        try {
          var manual = localStorage.getItem('finguide_theme_manual') === 'true';
          var saved = localStorage.getItem('finguide_theme');
          var theme = (manual && (saved === 'dark' || saved === 'light'))
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
