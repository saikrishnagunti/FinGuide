services:
  # ------------------------------------------------------------------------------
  # 1. FinGuide AI Agent Service (FastAPI + Gemini 3.5 Flash Lite + ARIMA/SARIMA)
  # ------------------------------------------------------------------------------
  - type: web
    name: finguide-agent
    runtime: python
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

  # ------------------------------------------------------------------------------
  # 2. FinGuide API Gateway (Node.js Express + SQLite Persistent Disk + Auth)
  # ------------------------------------------------------------------------------
  - type: web
    name: finguide-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    disk:
      name: finguide_data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/finguide.db
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_SERVICE_URL
        fromService:
          type: web
          name: finguide-agent
          property: host
      - key: CORS_ORIGIN
        sync: false
